name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint, format & audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level moderate

  test:
    name: Build & test (Node ${{ matrix.node }}, ${{ matrix.db }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
        db: [sqljs]
        include:
          - node: 24
            db: postgres
    services:
      postgres:
        image: ${{ matrix.db == 'postgres' && 'postgres:18-alpine' || '' }}
        env:
          POSTGRES_USER: vendure
          POSTGRES_PASSWORD: vendure
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DB: ${{ matrix.db }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
      - name: Build the dashboard with the extension
        if: matrix.node == 24 && matrix.db == 'sqljs'
        run: pnpm dashboard:build
      - name: Keep generated e-invoices for validation
        if: matrix.node == 24 && matrix.db == 'sqljs'
        uses: actions/upload-artifact@v4
        with:
          name: generated-invoices
          path: |
            test/__output__/e2e
            test/__output__/pdf
          if-no-files-found: error

  validate:
    name: Validate e-invoices (KoSIT, Mustang, veraPDF)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: generated-invoices
          path: test/__output__
      - uses: actions/cache@v4
        with:
          path: .validate-tools
          key: validate-tools-${{ hashFiles('test/validate/versions.env') }}
      - name: XML (golden files of all scenarios)
        run: bash test/validate/validate.sh test/golden
      - name: ZUGFeRD PDFs of all scenarios
        if: always()
        run: bash test/validate/validate.sh test/__output__/pdf
      - name: PDFs and XML generated from e2e orders
        if: always()
        run: bash test/validate/validate.sh test/__output__/e2e
      - uses: pnpm/action-setup@v4
        if: always()
      - uses: actions/setup-node@v4
        if: always()
        with:
          node-version: 24
          cache: pnpm
      - name: KositHttpValidator against a KoSIT daemon
        if: always()
        run: |
          pnpm install --frozen-lockfile
          bash test/validate/kosit-daemon.sh 8080
          KOSIT_URL=http://localhost:8080/ pnpm vitest run test/unit/validator.spec.ts
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: validation-reports
          path: test/__output__/validate
