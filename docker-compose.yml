services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: vendure
      POSTGRES_PASSWORD: vendure
      POSTGRES_DB: vendure_e_invoice
    ports:
      - '5432:5432'
    volumes:
      # Postgres 18 stores its data in a version subdirectory; a volume from 17 cannot be reused
      - pgdata18:/var/lib/postgresql
volumes:
  pgdata18:
