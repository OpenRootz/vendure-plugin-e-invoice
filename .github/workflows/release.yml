name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  # Everything that runs third-party code (install scripts, tests) happens here, without access to the npm token
  # or the OIDC token. The publish job only sees the packed tarball.
  build:
    name: Build, test & pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Tag matches package version
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
      - name: Pack
        run: pnpm pack --pack-destination package
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: package/*.tgz
          if-no-files-found: error
          retention-days: 7

  # Stages the version on npm through trusted publishing (OIDC): no npm token exists. The version is not installable
  # until a maintainer approves it on npmjs.com (Staged Packages) or with `npm stage approve`, which needs 2FA.
  publish:
    name: Stage on npm
    needs: build
    runs-on: ubuntu-latest
    # Protected by required reviewers; the trusted publisher on npm is bound to this workflow file and environment
    environment: npm
    permissions:
      contents: read
      id-token: write # trusted publishing and provenance
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: package
      # No registry-url: setup-node would write an .npmrc that expects a token
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: npm supports staged publishing (>= 11.15)
        run: |
          version="$(npm --version)"
          echo "npm $version"
          node -e "const [major, minor] = process.argv[1].split('.').map(Number); process.exit(major > 11 || (major === 11 && minor >= 15) ? 0 : 1)" "$version"
      # The leading ./ matters: npm reads `package/<file>.tgz` as the GitHub shorthand `owner/repo`
      - run: npm stage publish ./package/*.tgz --access public --provenance
