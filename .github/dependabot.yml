version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Give the registry time to catch compromised releases before they are proposed
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore
      include: scope
    groups:
      vendure:
        patterns: ['@vendure/*']
      lint-and-format:
        patterns: ['eslint', '@eslint/*', 'typescript-eslint', 'eslint-*', 'globals', 'prettier']
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # Matches the oldest supported Node version (engines.node)
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
      # Must match the graphql major that @vendure/core depends on
      - dependency-name: 'graphql'
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: chore
